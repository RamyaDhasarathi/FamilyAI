plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.rortechnologies.familyos'
version = '0.1.0'

android {
  namespace "expo.modules.familyoscollect"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    // Keep rules the release build (R8) applies to the whole app: see consumer-rules.pro.
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
}
