<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FamilyOS · Guide</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@openuidev/browser-bundle@0.1.7/dist/openui-styles.css">
<style>
  :root { --bg: #f6f4ef; --fg: #1f1d1a; --fg3: #7d766d; --line: #dcd6cc; --accent: #b5472b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161512; --fg: #ece8e0; --fg3: #8a8378; --line: #332f29; --accent: #e0805f; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .sub { color: var(--fg3); font-size: 13px; }
  .status { font-size: 13px; color: var(--fg3); margin: 8px 0 14px; min-height: 1.4em; }
  .status b { color: var(--accent); font-weight: 600; }
  .picker { display: grid; gap: 10px; }
  .picker button { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  .picker button small { display: block; color: var(--fg3); }
  #gate { display: none; border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  #gate form { display: flex; gap: 8px; flex-wrap: wrap; }
  #gate input { flex: 1; min-width: 180px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font: inherit; }
  #gate button, .bar button { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 16px; }
  .bar button.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  #root { min-height: 200px; }
  details.code { margin-top: 24px; font-size: 12px; color: var(--fg3); }
  details.code pre { white-space: pre-wrap; word-break: break-word; background: rgba(127,127,127,.08); padding: 10px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Guide</h1><span class="sub">A page composed for one plan, from the plan's own facts. A pilot of generative UI. <a href="/app/#/plans">Back to plans</a></span></header>
  <div id="gate"><p>Sign in first: paste the mailed link, or open the console and come back.</p><form id="gateForm"><input id="gateLink" placeholder="lnk_…" autocomplete="off"><button type="submit">Sign in</button></form></div>
  <div id="picker" class="picker" hidden></div>
  <div id="status" class="status"></div>
  <div id="bar" class="bar" hidden><button id="again" class="ghost">Compose again</button><button id="askBtn" class="ghost">Ask about this plan</button></div>
  <div id="root"></div>
  <details class="code" id="codeBox" hidden><summary>The page's own lines</summary><pre id="code"></pre></details>
</div>
<script src="https://cdn.jsdelivr.net/npm/@openuidev/browser-bundle@0.1.7/dist/openui-bundle.min.js"></script>
<script src="guide.js"></script>
</body>
</html>
