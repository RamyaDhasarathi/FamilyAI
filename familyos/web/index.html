<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FamilyOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&display=swap">
<link rel="stylesheet" href="app.css">
<script>
/* Light is the default now -- a warm canvas, not a dark console -- so only a
   stored "dark" does anything before the stylesheet paints. Wrapped because
   localStorage throws in a private window, and a theme is not worth failing
   a page load over. */
try {
  if (localStorage.getItem('familyos.theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
} catch (e) { /* default stands */ }
</script>
</head>
<body>
<div id="root" class="boot">Loading&hellip;</div>
<script src="app.js"></script>
</body>
</html>
