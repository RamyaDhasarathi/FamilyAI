<!doctype html>
<html lang="en" data-stage="7" data-seg="adult">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>FamilyOS Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="orbit.css">
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>

<div id="app">
  <main id="home" class="home" aria-label="Home">
    <header class="home-head">
      <h1 class="brand"><span id="brandName">FamilyOS</span> <span class="house">&middot; <span id="podHouse"></span></span></h1>
      <button id="pod" class="pod" aria-haspopup="true" aria-expanded="false">Active Pod &ndash; <span id="podName"></span> <span class="caret" aria-hidden="true">&#9662;</span></button>
      <span id="personaTag" class="persona-tag"></span>
      <p id="statusWord" class="sr-only" aria-live="polite"></p>
    </header>
    <div id="podMenu" class="pod-menu glass" hidden></div>
    <div class="field" id="field">
      <canvas id="fieldCanvas" aria-hidden="true"></canvas>
      <div class="orbs" id="orbs" role="group" aria-label="The five spaces, and anything that needs you"></div>
    </div>
    <section id="noteCard" class="note-card glass" aria-live="polite" hidden></section>
    <button class="swipe-hint" id="openDash" aria-label="Open the dashboard">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/></svg>
      Swipe up for dashboard
    </button>
  </main>

  <button id="sliver" class="sliver" tabindex="-1" aria-label="Back to home (closes the dashboard)"></button>

  <section id="sheet" class="sheet glass" aria-label="Dashboard" aria-hidden="true" inert>
    <div class="grip" id="grip" role="button" tabindex="0" aria-label="Collapse the dashboard (or drag down)"><span class="pill"></span></div>
    <header class="sheet-head">
      <div class="crumbs" id="crumbs" tabindex="-1"></div>
      <button id="bentoBtn" class="icon-btn" aria-label="Back to the dashboard grid" title="Dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="9" rx="1.5"/><rect x="13" y="4" width="7" height="5" rx="1.5"/><rect x="13" y="11" width="7" height="9" rx="1.5"/><rect x="4" y="15" width="7" height="5" rx="1.5"/></svg>
      </button>
    </header>
    <div class="layers" id="layers"></div>
  </section>

  <div class="dock" id="dock">
    <p class="dock-hint" aria-hidden="true">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/></svg>
      Swipe down to collapse
    </p>
    <div class="dock-row">
      <canvas id="wave" class="wave" aria-hidden="true"></canvas>
      <form id="askBar" class="ask-bar glass" hidden>
        <svg class="kb" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M8.5 14h7"/></svg>
        <input id="askInput" type="text" maxlength="1000" autocomplete="off" placeholder="Ask anything&hellip;">
      </form>
      <button id="fab" class="fab" aria-label="Chat with FamilyOS. Press and hold to hear the day read aloud." aria-expanded="false">
        <span class="fab-ring" aria-hidden="true"></span>
        <span class="fab-core" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
        </span>
      </button>
    </div>
    <p class="fab-label" aria-hidden="true">Tap to chat &bull; Hold to listen</p>
  </div>

  <section id="chat" class="chat glass" role="dialog" aria-label="Ask FamilyOS" hidden>
    <header class="chat-head">
      <b>Ask FamilyOS</b>
      <button id="chatListen" class="icon-btn" aria-label="Read me the day" title="Read me the day"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></button>
      <button id="chatClear" class="text-btn">Clear</button>
      <button id="chatClose" class="icon-btn" aria-label="Close the chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>
    <div id="thread" class="thread" aria-live="polite"></div>
    <form id="chatForm" class="composer">
      <input id="chatInput" type="text" maxlength="1000" autocomplete="off" placeholder="Ask, or say what should happen&hellip;" aria-label="Your message">
      <button id="chatMic" type="button" class="icon-btn mic" aria-label="Speak instead of typing" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      <button type="submit" class="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </form>
    <p class="chat-foot">I see only what you can see. I never send, pay or change anything on my own.</p>
  </section>

  <section id="speech" class="speech glass" role="dialog" aria-label="The day, read aloud" hidden>
    <header><b>Your day</b><span id="speechNote" class="muted"></span></header>
    <div id="speechText" class="speech-text" aria-live="polite"></div>
    <button id="speechStop" class="btn primary">Stop</button>
  </section>

  <div id="modalRoot" class="modal-root"></div>
</div>

<div id="gate" class="gate" hidden></div>
<div id="toast" class="toast glass" role="status" aria-live="polite"></div>

<script type="module" src="orbit.js"></script>
</body>
</html>
