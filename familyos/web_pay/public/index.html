<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FamilyOS payments</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --paper:#f5f5f7; --card:#fff; --ink:#1d1d1f; --ink2:#424245; --ink3:#6e6e73; --line:rgba(0,0,0,.08); --primary:#0071e3; --green:#1f9d55; --warn:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --paper:#000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#c7c7cc; --ink3:#98989d; --line:rgba(255,255,255,.10); --primary:#2997ff; --green:#4cd37f; --warn:#f0b45a; } }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 Inter,system-ui,-apple-system,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 64px; display:grid; gap:20px; }
  h1 { font:600 30px/1.1 Inter,system-ui,-apple-system,sans-serif; letter-spacing:-.03em; margin:0; } h2 { font-size:15px; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .muted { color:var(--ink3); font-size:13px; } .ok { color:var(--green); } .warn { color:var(--warn); }
  button { font:inherit; font-weight:600; padding:10px 16px; border-radius:999px; border:0; background:var(--primary); color:#fff; cursor:pointer; min-height:44px; }
  button.quiet { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  a { color:var(--primary); }
</style>
</head>
<body><main id="root"><p class="muted">Loading</p></main><script src="bundle.js"></script></body>
</html>
