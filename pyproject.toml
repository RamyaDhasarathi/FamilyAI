[project]
name = "familyos"
version = "0.1.0"
description = "A household agent that turns school notices, bills and forms into things that get done."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "boto3>=1.34",
    "pymupdf>=1.24",
    # Reads the UPI QR on a bill's PDF; a self-contained wheel, no system library.
    "zxing-cpp>=2.2",
    "pillow>=10",
    "pillow-heif>=0.18",
    # The live view's wire to the sitting's browser.
    "websockets>=13",
    "pytesseract>=0.3.10",
    "pillow>=10",
    "pillow-heif>=0.18",
    "anthropic>=1.12",
    "openai>=1.60",
    # Every outbound call the server makes itself: Google, Telegram, the
    # research providers, the disposable browser.
    "httpx>=0.27",
    # Attaches to the hosted browser over CDP for errands and sittings; the
    # browser is Steel's, so no browser download is needed here.
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "moto[s3]>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["familyos*"]

[tool.setuptools.package-data]
familyos = ["migrations/*.sql", "web/*.html", "web/*.css", "web/*.js", "web_classic/*.html", "web_classic/*.css", "web_classic/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/demo/*" = ["E701", "E702"]   # the recording scripts keep one step per line
# Kept close to Orbit's original so upstream fixes port by diff.
"familyos/jobs.py" = ["E702"]
