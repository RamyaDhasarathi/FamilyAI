# The whole console through the tunnel, for a phone outside the house.
#
# scripts/ngrok-telegram.yml serves one path and denies the rest, because
# POST /v1/households once took no auth. It takes a founding ticket now, every
# other route checks a session token, and the inbound webhooks check their
# own secrets -- so the API can face the internet. What this policy still
# refuses is the API's self-description: nobody outside needs the schema.
on_http_request:
  - expressions:
      - "req.url.path.startsWith('/docs') || req.url.path.startsWith('/redoc') || req.url.path == '/openapi.json'"
    actions:
      - type: deny
        config:
          status_code: 404
