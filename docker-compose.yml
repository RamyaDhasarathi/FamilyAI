# Local infrastructure: Postgres (with pgvector, used from milestone 2) and
# MinIO as the S3-compatible object store. Run the app on the host:
#   cp .env.example .env && uvicorn familyos.main:app --reload
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: familyos
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FAMILYOS_S3_ACCESS_KEY_ID:?set FAMILYOS_S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${FAMILYOS_S3_SECRET_ACCESS_KEY:?set FAMILYOS_S3_SECRET_ACCESS_KEY in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  minio-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_USER: ${FAMILYOS_S3_ACCESS_KEY_ID:?set FAMILYOS_S3_ACCESS_KEY_ID in .env}
      MINIO_PASS: ${FAMILYOS_S3_SECRET_ACCESS_KEY:?set FAMILYOS_S3_SECRET_ACCESS_KEY in .env}
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASS; do sleep 1; done;
             mc mb --ignore-existing local/familyos-originals"

volumes:
  pgdata:
  miniodata:
